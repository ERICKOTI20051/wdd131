<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form for WDD 131">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header><h1>Product Review</h1></header>
  <main>
    <form action="review.html" method="get">
      <div class="field">
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>Overall Rating</legend>
        <div class="stars">
          <input type="radio" id="star5" name="rating" value="5" required><label for="star5" title="5 stars"><span class="sr">5 stars</span></label>
          <input type="radio" id="star4" name="rating" value="4" required><label for="star4" title="4 stars"><span class="sr">4 stars</span></label>
          <input type="radio" id="star3" name="rating" value="3" required><label for="star3" title="3 stars"><span class="sr">3 stars</span></label>
          <input type="radio" id="star2" name="rating" value="2" required><label for="star2" title="2 stars"><span class="sr">2 stars</span></label>
          <input type="radio" id="star1" name="rating" value="1" required><label for="star1" title="1 star"><span class="sr">1 star</span></label>
        </div>
      </fieldset>

      <div class="field">
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="field">
        <legend>Useful Features</legend>
        <div class="check"><input type="checkbox" id="durability" name="features" value="Durability"><label for="durability">Durability</label></div>
        <div class="check"><input type="checkbox" id="ease" name="features" value="Ease of use"><label for="ease">Ease of use</label></div>
        <div class="check"><input type="checkbox" id="design" name="features" value="Design"><label for="design">Design</label></div>
        <div class="check"><input type="checkbox" id="performance" name="features" value="Performance"><label for="performance">Performance</label></div>
      </fieldset>

      <div class="field">
        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="userName">Your Name (optional)</label>
        <input type="text" id="userName" name="userName" autocomplete="name">
      </div>

      <input type="submit" value="Submit Review">
    </form>
  </main>
  <footer>
    <p>&copy; <span id="currentyear"></span> | Your Name | Your Location</p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
